name: Build Kindle dashboard

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kindle-dashboard
  cancel-in-progress: true

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r kindle-dashboard/requirements.txt

      - name: Render dashboard
        run: python kindle-dashboard/render.py
        env:
          TFL_APP_KEY: ${{ secrets.TFL_APP_KEY }}
          LDBWS_API_KEY: ${{ secrets.LDBWS_API_KEY }}
          GOOGLE_CALENDAR_ICS_URL: ${{ secrets.GOOGLE_CALENDAR_ICS_URL }}

      - name: Upload dashboard to private Cloudflare R2 via Worker
        env:
          CF_WORKER_URL: ${{ secrets.CF_WORKER_URL }}
          CF_UPLOAD_TOKEN: ${{ secrets.CF_UPLOAD_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CF_WORKER_URL"
          test -n "$CF_UPLOAD_TOKEN"
          curl --fail-with-body --silent --show-error \
            --request PUT \
            --url "${CF_WORKER_URL%/}/upload/dashboard.png" \
            --header "Authorization: Bearer ${CF_UPLOAD_TOKEN}" \
            --header "Content-Type: image/png" \
            --data-binary @site/dashboard.png
